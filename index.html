<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Software Invoice Studio — create invoices, quotations and business documents locally in your browser." />
    <title>Software Invoice Studio</title>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <noscript>Software Invoice Studio requires JavaScript.</noscript>
    <script>
      // Shown only if the app never starts — e.g. GitHub Pages is serving the unbuilt source files.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="max-width:560px;margin:64px auto;padding:24px;font:15px/1.5 system-ui,sans-serif;border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#1e293b">' +
            '<h1 style="font-size:18px;margin:0 0 8px">The app has not been built for this site yet</h1>' +
            '<p style="margin:0 0 8px">GitHub Pages is publishing the source files instead of the built app.</p>' +
            '<p style="margin:0">Repository owner: open <b>Settings &rarr; Pages</b>, set <b>Source</b> to <b>GitHub Actions</b>, then re-run the <b>Deploy to GitHub Pages</b> workflow in the <b>Actions</b> tab.</p></div>';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
